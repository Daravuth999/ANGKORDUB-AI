  <script type="module">
// AngkorDub AI — Standalone Zero-Backend Production Engine (app.js)
// Supports Scribe v2 STT + Diarization, Gemini 2.5 Isochronous Director, ElevenLabs v3 Emotional Synthesis & 60fps Lip-Sync ROI Warping

const STORAGE_KEYS = {
  ELEVEN_KEY: 'ANGKORDUB_ELEVENLABS_KEY',
  GEMINI_KEY: 'ANGKORDUB_GEMINI_KEY',
  GEMINI_MODEL: 'ANGKORDUB_GEMINI_MODEL',
  VOICE_VAULT: 'ANGKORDUB_VOICE_VAULT'
};

export function detectHardwareEngine() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isMac = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1;
  const cores = navigator.hardwareConcurrency || 4;
  const sab = typeof SharedArrayBuffer !== 'undefined';
  if (isIOS || isMac) {
    return `iPhone iOS VideoToolbox + A-Series CPU (${cores} Cores ${sab ? '• SAB' : ''})`;
  }
  return `PC WebCodecs GPU/NVENC/Multi-Thread CPU (${cores} Threads ${sab ? '• SAB Unlocked' : ''})`;
}

export async function encodeAudioBufferTo16kWav(audioBuffer) {
  const targetRate = 16000;
  const offline = new OfflineAudioContext(1, Math.ceil(audioBuffer.duration * targetRate), targetRate);
  const src = offline.createBufferSource();
  src.buffer = audioBuffer;
  src.connect(offline.destination);
  src.start(0);
  const rendered = await offline.startRendering();
  const pcm = rendered.getChannelData(0);
  const wavBuffer = new ArrayBuffer(44 + pcm.length * 2);
  const view = new DataView(wavBuffer);
  const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + pcm.length * 2, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, targetRate, true);
  view.setUint32(28, targetRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) {
    const s = Math.max(-1, Math.min(1, pcm[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([wavBuffer], { type: 'audio/wav' });
}

export async function callScribeV2(elevenKey, wavBlob, langCode = 'auto') {
  const fd = new FormData();
  fd.append('file', wavBlob, 'audio_16k.wav');
  fd.append('model_id', 'scribe_v2');
  fd.append('diarize', 'true');
  fd.append('tag_audio_events', 'true');
  if (langCode !== 'auto') fd.append('language_code', langCode);
  const res = await fetch('https://api.elevenlabs.io/v1/speech-to-text', {
    method: 'POST',
    headers: { 'xi-api-key': elevenKey },
    body: fd
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

export async function callGeminiDirector(geminiKey, model, segments, direction) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${geminiKey}`;
  const targetDesc = direction === 'EN_TO_KM'
    ? 'natural cinematic spoken Khmer (ភាសាខ្មែរនិយាយធម្មជាតិក្នុងភាពយន្ត)'
    : 'natural cinematic spoken English';
  const body = {
    contents: [{
      role: 'user',
      parts: [{
        text: `Translate these movie segments to ${targetDesc} matching exact duration (end - start) and inject ElevenLabs v3 emotion tags ([whispers], [shouting], [sighs], [tense], [excited], [sarcastic]): ${JSON.stringify(segments)}`
      }]
    }],
    generationConfig: {
      responseMimeType: 'application/json',
      responseSchema: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: {
            id: { type: 'STRING' },
            emotion_tag: { type: 'STRING' },
            translated_text: { type: 'STRING' }
          },
          required: ['id', 'emotion_tag', 'translated_text']
        }
      }
    }
  };
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  const data = await res.json();
  return JSON.parse(data.candidates[0].content.parts[0].text);
}

export async function callElevenLabsV3TTS(elevenKey, voiceId, emotionTag, text) {
  const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
    method: 'POST',
    headers: {
      'xi-api-key': elevenKey,
      'Content-Type': 'application/json',
      'Accept': 'audio/mpeg'
    },
    body: JSON.stringify({
      text: `${emotionTag} ${text}`,
      model_id: 'eleven_v3',
      voice_settings: {
        stability: 0.35,
        similarity_boost: 0.85,
        style: 0.65,
        use_speaker_boost: true
      }
    })
  });
  if (!res.ok) throw new Error(await res.text());
  return res.arrayBuffer();
}

document.getElementById('hwBadge').textContent = detectHardwareEngine();
  </script>
